name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12.14"
      - run: uv sync --locked
      - run: ./scripts/check.sh
